name: Snapshot build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Daily 10:00 UTC

jobs:
  snapshot:
    uses: Beeps-Workshop/.github/.github/workflows/snapshot.yml@main
    with:
      build-system: gradle
      project: bmcrm
      jar-glob: build/libs/bmcrm-*.jar
      loaders: neoforge
      game-versions: '1.21.1'
      java-version: '21'
      force: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
