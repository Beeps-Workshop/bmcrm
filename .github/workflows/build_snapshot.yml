name: Snapshot Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Every day at 10:00 UTC

permissions:
  contents: read
  actions: read

jobs:
  check-recent-commits:
    runs-on: ubuntu-latest
    outputs:
      recent: ${{ steps.check.outputs.recent }}
      count: ${{ steps.check.outputs.count }}
    steps:
      - name: Check for commits in last 24h
        id: check
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          COUNT=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO}/commits?since=${SINCE}" \
            | jq 'length')
          echo "Commits in last 24h: ${COUNT}"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" -gt 0 ]; then
            echo "recent=true" >> "$GITHUB_OUTPUT"
          else
            echo "recent=false" >> "$GITHUB_OUTPUT"
          fi

  build-snapshot:
    name: Build Snapshot
    needs: check-recent-commits
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-recent-commits.outputs.recent == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get latest release tag
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate snapshot version
        id: versioning
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          DATE=$(date +'%y%m%d') # Format: YYMMDD
          API_URL="https://api.github.com/repos/${REPO}/actions/artifacts"

          # Count matching snapshot builds for the current date to get an incrementing suffix
          BUILD_COUNT=$(curl -s -H "Authorization: Bearer $TOKEN" "$API_URL" \
            | jq "[.artifacts[] | select(.name | startswith(\"bmcrm-${BASE_VERSION}-SNAPSHOT-${DATE}\"))] | length")

          BUILD_COUNT=$((BUILD_COUNT + 1))
          VERSION="${BASE_VERSION}-SNAPSHOT-${DATE}${BUILD_COUNT}"

          echo "Generated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build project
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -Pmod_version=${{ steps.versioning.outputs.version }}

      - name: Collect JAR
        run: |
          mkdir out
          mv build/libs/bmcrm-${{ steps.versioning.outputs.version }}.jar ./out/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmcrm-${{ steps.versioning.outputs.version }}
          path: ./out/bmcrm-${{ steps.versioning.outputs.version }}.jar
          retention-days: 180

      - uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: 3tJg5Y5b
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1619083
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: "${{ steps.versioning.outputs.version }}"
          version-type: alpha
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          files: ./out/bmcrm-${{ steps.versioning.outputs.version }}.jar
          changelog: |
            Snapshot build ${{ steps.versioning.outputs.version }}. Snapshots are automatically generated and may contain untested changes, please use them with caution.
            ${{ steps.latest_release.outputs.tag && format('[View changes since {0}](https://github.com/{1}/compare/{0}...{2})', steps.latest_release.outputs.tag, github.repository, github.sha) || '' }}
