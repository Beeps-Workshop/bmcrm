name: Release build

# bmcrm's release orchestrator: derives the version from the tag, then calls the shared reusable
# workflows to build -> publish. Goes in bmcrm at .github/workflows/build_release.yml.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.1.0)'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          RAW="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: Beeps-Workshop/.github/.github/workflows/build.yml@main
    with:
      build-system: gradle
      version: ${{ needs.prepare.outputs.version }}
      artifact-name: bmcrm
      jar-glob: build/libs/bmcrm-*.jar

  release:
    needs: [prepare, build]
    uses: Beeps-Workshop/.github/.github/workflows/release.yml@main
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact-name: bmcrm
      modrinth-id: 3tJg5Y5b
      curseforge-id: '1619083'
      loaders: neoforge
      game-versions: '1.21.1'
      version-type: release
    secrets: inherit
