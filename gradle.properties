# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## Environment / toolchain versions
# NOTE: These pin the toolchain. Verify against the current NeoForge MDK
# (https://github.com/NeoForged/MDK/tree/1.21.1) before your first build and
# bump if a newer patch is out — the exact NeoForge/Parchment patch is not
# critical, but the versions must actually exist on the maven repos.

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# NeoForge — 1.21.1 line (21.1.x)
neo_version=21.1.209
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment mappings (parameter names + javadocs)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod metadata
mod_id=beepsresourcegenerators
mod_name=Beeps Resource Generators
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.beepsterr.resourcegenerators
mod_authors=Beeps
mod_description=A multiblock-style resource generator: a central accumulator rolls loot tables contributed by nearby crystals.

## Dev-only test dependencies (loaded only in the dev runtime, not shipped)
# JEI (Just Enough Items) — item/recipe browser.
jei_version=19.39.0.368
# Jade — in-world block/block-entity inspection tooltip. Modrinth version id (15.10.5+neoforge).
jade_version=yd8FKCmx
# Mekanism — modded ores w/ c: tags for crystal auto-detection testing. Modrinth version id (10.7.19.85).
mekanism_version=5KzzycBT
# AlmostUnified — soft dependency; compiled against but only used at runtime if present. Modrinth id (1.21.1-1.4.2).
almostunified_version=e8iYxxI3
# Ponder — soft dependency (Create's in-world scene system, extracted). Compiled against but only
# loaded at runtime if the player installs it. Hard-requires Flywheel, pulled transitively in dev.
ponder_version=1.0.87
