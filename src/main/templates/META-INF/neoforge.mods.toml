modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://beepsterr.com/discord"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    displayURL = "https://modrinth.com/project/bmcrm"
    logoFile = "logo.png"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# AlmostUnified is a soft dependency handled entirely at runtime via ModList.isLoaded — it is
# deliberately NOT declared here (its "1.21.1-1.4.2" version makes Maven range checks meaningless).
